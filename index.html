<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <meta name="description" content="AI-powered Intelligent Business Consultant & Workflow Helper utilizing Generative AI.">
    <title>Intelligent Business Consultant | GenAI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header role="banner">
        <h1>Intelligent Business Consultant</h1>
        <p>AI-Powered Workflow Helper & Enterprise Optimization</p>
    </header>

    <main role="main" class="container">
        <section class="chat-interface" aria-label="AI Consultation Interface">
            <div id="chat-window" class="chat-window" aria-live="polite" role="log">
                <div class="message ai-message">
                    <strong>Consultant AI:</strong> Hello! I am your Intelligent Business Consultant. How can I optimize your workflow today?
                </div>
            </div>

            <form id="chat-form" class="input-area" aria-label="Message Input Form">
                <label for="user-input" class="sr-only">Type your business query</label>
                <input type="text" id="user-input" placeholder="e.g., Draft a client consultation proposal..." required aria-required="true">
                <button type="submit" id="send-btn" aria-label="Send prompt to AI">Analyze</button>
            </form>
        </section>

        <aside class="quick-actions" aria-label="Automated Workflow Actions">
            <h2>Workflow Automation</h2>
            <button class="action-btn" data-prompt="Draft a client consultation proposal." aria-label="Quick Action: Draft Proposal">Draft Proposal</button>
            <button class="action-btn" data-prompt="Generate a Q4 risk assessment matrix." aria-label="Quick Action: Risk Assessment">Risk Assessment</button>
            <button class="action-btn" data-prompt="Resolve high-priority support ticket." aria-label="Quick Action: Support Triage">Support Triage</button>
        </aside>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
