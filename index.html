<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <meta name="description" content="AI Celebration & Event Planner for Weddings, Birthdays, and Community Events.">
    <title>AI Celebration Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header role="banner">
        <h1>AI Celebration & Event Planner</h1>
        <p>Smart Budgets, Timelines, Vendor Checklists & Personalized Ideas</p>
    </header>

    <main role="main" class="container">
        <section class="chat-interface" aria-label="Event Planner Interface">
            <div id="chat-window" class="chat-window" aria-live="polite" role="log">
                <div class="message ai-message">
                    <strong>Event Planner AI:</strong> Hello! I organize <strong>Weddings</strong>, <strong>Birthdays</strong>, and <strong>Community Events</strong> with detailed budgets, timelines, vendor checklists, and personalized ideas.
                </div>
            </div>

            <form id="chat-form" class="input-area" aria-label="Event Query Form">
                <label for="user-input" class="sr-only">Type your event query</label>
                <input type="text" id="user-input" placeholder="e.g., Plan a Wedding for 100 guests..." required aria-required="true">
                <button type="submit" id="send-btn" aria-label="Generate Event Plan">Plan Event</button>
            </form>
        </section>

        <aside class="quick-actions" aria-label="Event Shortcuts">
            <h2>Quick Shortcuts</h2>
            <button class="action-btn" data-prompt="Plan a Wedding with budget breakdown, timeline, and vendor checklist." aria-label="Plan Wedding">💒 Wedding</button>
            <button class="action-btn" data-prompt="Organize a Birthday Party with timeline, budget, and personalized ideas." aria-label="Plan Birthday">🎂 Birthday</button>
            <button class="action-btn" data-prompt="Coordinate a Community Event with vendor checklist and volunteer timeline." aria-label="Plan Community Event">🎈 Community</button>
        </aside>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
