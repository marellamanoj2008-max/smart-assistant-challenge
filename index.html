<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <meta name="description" content="AI-Powered Celebration & Event Planner utilizing Generative AI for automated scheduling and budgeting.">
    <title>AI Celebration & Event Planner | GenAI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header role="banner">
        <h1>AI Celebration & Event Planner</h1>
        <p>Intelligent Event Scheduling, Budgeting & Celebration Assistant</p>
    </header>

    <main role="main" class="container">
        <section class="chat-interface" aria-label="Event Planning Assistant Interface">
            <div id="chat-window" class="chat-window" aria-live="polite" role="log">
                <div class="message ai-message">
                    <strong>Event Planner AI:</strong> Welcome! I am your AI Celebration & Event Planner. What event or party are we organizing today?
                </div>
            </div>

            <form id="chat-form" class="input-area" aria-label="Event Query Form">
                <label for="user-input" class="sr-only">Type your event query</label>
                <input type="text" id="user-input" placeholder="e.g., Plan a 50-person anniversary party schedule..." required aria-required="true">
                <button type="submit" id="send-btn" aria-label="Generate Event Plan">Plan Event</button>
            </form>
        </section>

        <aside class="quick-actions" aria-label="Event Planning Actions">
            <h2>Event Automation</h2>
            <button class="action-btn" data-prompt="Draft a birthday party timeline and itinerary." aria-label="Quick Action: Party Itinerary">Party Itinerary</button>
            <button class="action-btn" data-prompt="Calculate budget and vendor list for 100 guests." aria-label="Quick Action: Budget Calculation">Budget & Vendors</button>
            <button class="action-btn" data-prompt="Generate wedding ceremony checklist and RSVP tracker." aria-label="Quick Action: Wedding Checklist">Wedding Checklist</button>
        </aside>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
